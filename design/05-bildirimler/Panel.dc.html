<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Zil paneli ve önizleme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.fg-row:hover{background:var(--surface-alt)}
</style>
</helmet>
<div style="{{rootStyle}}">
<div style="position: relative; width: 1280px; height: 900px; overflow: hidden; background: var(--background); color: var(--text); font-family: var(--font); font-variant-numeric: tabular-nums">

<header style="position: relative; z-index: 2; height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border)">
<div style="max-width: var(--content-max); height: 100%; margin: 0 auto; padding: 0 var(--s6); box-sizing: border-box; display: flex; align-items: center; gap: var(--s6)">
<span style="display: flex; align-items: center; gap: var(--s2)"><span style="width: 32px; height: 32px; border-radius: var(--r-md); background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span><span style="font-size: var(--fs-h3); font-weight: 700">FırsatGeldi</span></span>
<nav aria-label="Ana menü" style="display: flex; gap: var(--s5); font-size: var(--fs-bsm); font-weight: 500; color: var(--text-muted)"><a href="#" style="color: var(--primary); font-weight: 600; text-decoration: none">Ana Sayfa</a><a href="#" style="color: inherit; text-decoration: none">Takip</a><a href="#" style="color: inherit; text-decoration: none">Ara ve Ekle</a><a href="#" style="color: inherit; text-decoration: none">Kazancım</a></nav>
<div style="flex: 1"></div>
<button type="button" aria-label="{{bellLabel}}" aria-expanded="true" aria-controls="zil-paneli" style="position: relative; width: var(--touch); height: var(--touch); border: 0; border-radius: var(--r-pill); background: var(--primary-subtle); color: var(--on-primary-subtle); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="{{badgeStyle}}">{{unread}}</span></sc-if></button>
<span style="width: 34px; height: 34px; border-radius: var(--r-pill); background: var(--primary-subtle); color: var(--on-primary-subtle); display: flex; align-items: center; justify-content: center; font-size: var(--fs-cap); font-weight: 700">SB</span>
</div>
</header>

<div aria-hidden="true" style="max-width: var(--content-max); margin: 0 auto; padding: var(--s8) var(--s6); display: flex; flex-direction: column; gap: var(--s5)">
<span style="font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: 700">Merhaba Serkan</span>
<div style="height: 56px; border-radius: var(--r-xl); background: var(--surface)"></div>
<div style="height: 320px; border-radius: var(--r-lg); background: var(--surface)"></div>
<div style="height: 120px; border-radius: var(--r-lg); background: var(--surface)"></div>
</div>
<div style="position: absolute; inset: var(--header-h) 0 0 0; background: var(--overlay)"></div>

<!-- ÖNİZLEME -->
<sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
<section aria-label="Bildirim önizlemesi" aria-live="polite" style="position: absolute; z-index: 3; top: calc(var(--header-h) + 24px); right: calc(var(--side-panel-w) + 24px); width: 560px; max-height: 790px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--sh-lg); overflow: hidden">
<div style="display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s5); border-bottom: 1px solid var(--divider)">
<span style="{{p.badgeStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"/></svg></span>
<span style="flex: 1; font-size: var(--fs-bsm); font-weight: 700">{{p.type}} <span style="font-weight: 500; color: var(--text-muted)">· {{p.time}}</span></span>
<button type="button" aria-label="Önizlemeyi kapat" onClick="{{closePrev}}" style="width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4)">
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--s4); align-items: center">
<span role="img" aria-label="{{p.imgLabel}}" style="{{p.imgStyle}}"><sc-if value="{{p.isLock}}" hint-placeholder-val="{{ false }}"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.prodIcon}}"/></svg></sc-if><sc-if value="{{p.isProd}}" hint-placeholder-val="{{ true }}"><svg width="100" height="100" viewBox="0 0 48 48" aria-hidden="true"><path d="{{p.art.a}}" fill-rule="evenodd" style="fill: var(--text)"/><path d="{{p.art.c}}" fill-rule="evenodd" style="fill: var(--surface)"/><path d="{{p.art.b}}" fill-rule="evenodd" style="fill: var(--text-muted)"/></svg></sc-if></span>
<div style="display: flex; flex-direction: column; gap: var(--s1); min-width: 0">
<sc-if value="{{p.hasMode}}" hint-placeholder-val="{{ true }}"><span style="{{p.modeStyle}}">{{p.mode}}</span></sc-if>
<span style="font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: 700">{{p.title}}</span>
<span style="font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 500; color: var(--text-muted)">{{p.sub}}</span>
</div>
</div>

<p style="margin: 0; padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--surface-alt); font-size: var(--fs-bsm); line-height: var(--lh-bsm)">{{p.body}}</p>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3)">
<sc-for list="{{p.facts}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px; min-height: 64px; padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r-md)">
<span style="font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 600; color: var(--text-muted); white-space: nowrap">{{f.k}}</span>
<span style="{{f.style}}">{{f.v}}</span>
</div>
</sc-for>
</div>

<sc-if value="{{p.hasChart}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: var(--s2)">
<div style="display: flex; justify-content: space-between; font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 600; color: var(--text-muted)"><span>Son 14 gün · en ucuz fiyat</span><span>{{p.chartNote}}</span></div>
<svg viewBox="0 0 520 96" width="520" height="96" role="img" aria-label="{{p.chartLabel}}" style="display: block">
<line x1="0" y1="92" x2="520" y2="92" style="stroke: var(--chart-grid)" stroke-width="1"/>
<sc-if value="{{p.hasRef}}" hint-placeholder-val="{{ true }}"><line x1="0" y1="{{p.refY}}" x2="520" y2="{{p.refY}}" style="stroke: var(--chart-paid)" stroke-width="2" stroke-dasharray="{{p.refDash}}"/></sc-if>
<polyline points="{{p.line}}" fill="none" style="stroke: var(--chart-best)" stroke-width="2.4" stroke-dasharray="6 4"/>
</svg>
<span style="font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 500; color: var(--text-muted)">{{p.legend}}</span>
</div>
</sc-if>

<span style="display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 500; color: var(--text-muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>{{p.checked}}</span>
</div>

<div style="display: flex; justify-content: flex-end; gap: var(--s2); padding: var(--s4) var(--s5); border-top: 1px solid var(--divider)">
<sc-if value="{{p.hasB}}" hint-placeholder-val="{{ true }}"><a href="#" style="display: inline-flex; align-items: center; height: 48px; padding: 0 var(--s5); border: 1px solid var(--border); border-radius: var(--r-md); color: var(--text); font-size: var(--fs-btn); font-weight: 600; text-decoration: none">{{p.b}}</a></sc-if>
<a href="#" style="{{p.aStyle}}">{{p.a}}</a>
</div>
</section>
</sc-if>

<!-- ZİL PANELİ -->
<section id="zil-paneli" role="dialog" aria-modal="true" aria-labelledby="zil-baslik" style="position: absolute; z-index: 3; top: var(--header-h); right: 0; bottom: 0; width: var(--side-panel-w); display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--sh-lg)">
<div style="display: flex; align-items: center; gap: var(--s3); padding: var(--s5) var(--s5) var(--s3)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><h2 id="zil-baslik" style="margin: 0; font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: 700">Bildirimler</h2><span style="font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 500; color: var(--text-muted)">{{headSub}}</span></div>
<button type="button" onClick="{{readAll}}" style="height: 40px; padding: 0 var(--s3); border: 0; border-radius: var(--r-md); background: transparent; color: var(--primary); font: inherit; font-size: var(--fs-bsm); font-weight: 600; cursor: pointer">Tümünü okundu yap</button>
<button type="button" aria-label="Paneli kapat" style="width: 40px; height: 40px; border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>

<ul aria-label="Son 10 bildirim" style="flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0 var(--s2); list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="6">
<li>
<button type="button" class="fg-row" aria-pressed="{{n.pressed}}" onClick="{{n.open}}" style="{{n.btnStyle}}">
<span aria-hidden="true" style="{{n.dotStyle}}"></span>
<span style="position: relative; width: 52px; height: 52px">
<span role="img" aria-label="{{n.imgLabel}}" style="{{n.imgStyle}}"><sc-if value="{{n.isLock}}" hint-placeholder-val="{{ false }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.prodIcon}}"/></svg></sc-if><sc-if value="{{n.isProd}}" hint-placeholder-val="{{ true }}"><svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><path d="{{n.art.a}}" fill-rule="evenodd" style="fill: var(--text)"/><path d="{{n.art.c}}" fill-rule="evenodd" style="fill: var(--surface)"/><path d="{{n.art.b}}" fill-rule="evenodd" style="fill: var(--text-muted)"/></svg></sc-if></span>
<span aria-hidden="true" style="{{n.badgeStyle}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"/></svg></span>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="display: flex; justify-content: space-between; gap: var(--s2); font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: 600; color: var(--text-muted)"><span>{{n.type}}</span><span style="font-weight: 500">{{n.time}}</span></span>
<span style="{{n.titleStyle}}">{{n.title}}</span>
<span style="font-size: var(--fs-bsm); line-height: var(--lh-bsm); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{n.body}}</span>
<sc-if value="{{n.hasMode}}" hint-placeholder-val="{{ true }}"><span style="{{n.modeStyle}}">{{n.mode}}</span></sc-if>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{n.srState}}</span>
</span>
</button>
</li>
</sc-for>
</ul>

<div style="display: flex; justify-content: space-between; align-items: center; padding: var(--s3) var(--s5); border-top: 1px solid var(--divider)">
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: var(--touch); font-size: var(--fs-bsm); font-weight: 600; color: var(--primary); text-decoration: none">Tümünü gör<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: var(--touch); font-size: var(--fs-bsm); font-weight: 600; color: var(--text-muted); text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Bildirim ayarları</a>
</div>
</section>

</div>
</div>
</x-dc>
